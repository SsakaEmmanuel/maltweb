<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Account — MALTWEB Admin</title><link rel="stylesheet" href="assets/css/app.css"></head><body><header class="nav"><a class="brand" href="index.html">MALT<span>WEB</span></a><nav><a href="admin-users.html">Users</a><a href="admin.html">Admin</a></nav></header><main class="page"><p class="eyebrow">ADMIN EDIT</p><h1>Edit account profile</h1><form id="adminUserForm" class="card form"><div class="avatar-wrap"><img id="auAvatarPreview" class="avatar" src="" onerror="this.style.display='none'"><label class="button secondary">Choose profile picture<input id="auAvatarFile" type="file" accept="image/*" hidden></label></div><input id="auName" placeholder="Full name"><input id="auPhone" placeholder="Phone"><textarea id="auBio" placeholder="About the account holder"></textarea><button>Save changes</button><p id="auMsg" class="muted"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/v27.js"></script><script src="assets/js/v29.js"></script><script>async function initAdminUser(){if((await window.maltV29.role())!=="admin"){auMsg.textContent='Administrator access only.';return}const id=new URLSearchParams(location.search).get('id');const r=await maltSupabase.from('account_profiles').select('*').eq('user_id',id).maybeSingle();if(r.error||!r.data){auMsg.textContent=r.error?.message||'Profile not found.';return}const d=r.data;auName.value=d.full_name||'';auPhone.value=d.phone||'';auBio.value=d.bio||'';if(d.avatar_url)auAvatarPreview.src=d.avatar_url;adminUserForm.onsubmit=async e=>{e.preventDefault();let avatar=d.avatar_url||null;if(auAvatarFile.files[0])avatar=await v27Upload(auAvatarFile.files[0],'admin-avatar');const q=await maltSupabase.from('account_profiles').update({full_name:auName.value.trim(),phone:auPhone.value.trim()||null,bio:auBio.value.trim()||null,avatar_url:avatar,updated_at:new Date().toISOString()}).eq('user_id',id);auMsg.textContent=q.error?q.error.message:'✓ Account profile updated on behalf of the user.'}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initAdminUser);else initAdminUser();</script></body></html>
