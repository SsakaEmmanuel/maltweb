<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site Appearance — MALTWEB Admin</title><link rel="stylesheet" href="assets/css/app.css"></head><body><header class="nav admin-nav"><a class="brand" href="index.html">MALT<span>WEB</span></a><nav><a href="admin.html">Control Center</a><a href="admin-categories.html">Categories</a><a href="admin-content.html">Content</a></nav></header><main class="page admin-shell"><div class="admin-page-head"><div><p class="eyebrow">ADMIN WORKSPACE</p><h1>Site appearance</h1><p class="muted">Control the public home-page appearance. Only the administrator can change these settings.</p></div><a class="button secondary" href="admin.html">← Control Center</a></div><section class="admin-workspace"><section class="card"><p class="eyebrow">HOME PAGE</p><h2>Hero appearance</h2><form id="siteForm" class="form"><input id="siteTitle" placeholder="Home title"><textarea id="siteSubtitle" placeholder="Home subtitle"></textarea><label class="file-label">Hero image<input id="siteImage" type="file" accept="image/*"></label><button>Save appearance</button><p id="siteMsg" class="muted"></p></form></section><section class="card site-preview-card"><p class="eyebrow">PREVIEW</p><div id="sitePreview" class="site-preview"><div class="site-preview-image"></div><h2 id="previewTitle">MALTWEB</h2><p id="previewSubtitle">Your local digital ecosystem.</p></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/v27.js"></script><script src="assets/js/v29.js"></script><script>async function siteInit(){if(!(await v27Admin())){siteMsg.textContent='Administrator access only.';return}const s=await v27Settings();siteTitle.value=s.home_hero_title||'';siteSubtitle.value=s.home_hero_subtitle||'';previewTitle.textContent=siteTitle.value;previewSubtitle.textContent=siteSubtitle.value;if(s.home_hero_image)document.querySelector('.site-preview-image').style.backgroundImage=`url("${s.home_hero_image}")`;siteForm.onsubmit=async e=>{e.preventDefault();let url=s.home_hero_image||'';if(siteImage.files[0])url=await v27Upload(siteImage.files[0],'home-hero');const u=await v27User();for(const [key,value] of [['home_hero_image',url],['home_hero_title',siteTitle.value.trim()],['home_hero_subtitle',siteSubtitle.value.trim()]]){const r=await maltSupabase.from('site_settings').upsert({key,value,updated_by:u.id,updated_at:new Date().toISOString()});if(r.error){siteMsg.textContent=r.error.message;return;}}siteMsg.textContent='✓ Home appearance updated.';previewTitle.textContent=siteTitle.value;previewSubtitle.textContent=siteSubtitle.value;if(url)document.querySelector('.site-preview-image').style.backgroundImage=`url("${url}")`;}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',siteInit);else siteInit();</script></body></html>
