<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users — MALTWEB Admin</title><link rel="stylesheet" href="assets/css/app.css"><style>.user-tools{display:flex;gap:.65rem;flex-wrap:wrap;margin:1rem 0}.user-tools input,.user-tools select{flex:1;min-width:150px}.user-meta{font-size:.88rem;overflow-wrap:anywhere}.user-status{display:inline-block;padding:.2rem .55rem;border-radius:999px;background:rgba(100,116,139,.14);font-size:.78rem}.user-card{min-width:0}.user-card h2{overflow-wrap:anywhere}</style></head>
<body><header class="nav"><a class="brand" href="index.html">MALT<span>WEB</span></a><nav><a href="dashboard.html">Account</a><a href="admin.html">Admin</a><a href="admin-content.html">Content</a></nav></header>
<main class="page"><p class="eyebrow">ADMIN CONTROL</p><h1>Users &amp; profiles</h1><p id="usersMsg" class="muted" aria-live="polite">Checking administrator access…</p>
<div class="user-tools"><input id="userSearch" type="search" placeholder="Search name, email or phone" aria-label="Search users"><select id="roleFilter" aria-label="Filter by role"><option value="">All roles</option><option value="admin">Administrator</option><option value="user">Ordinary user</option><option value="business">Business</option><option value="organization">Organization</option><option value="service_provider">Service provider</option><option value="no-profile">No account profile</option></select><button id="reloadUsers" type="button" class="secondary">Refresh users</button></div><div id="usersList" class="grid"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/auth-gate.js"></script><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/v27.js"></script><script src="assets/js/v29.js"></script>
<script>
(function(){const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let allUsers=[];
function roleName(r){return ({admin:'Administrator',user:'Ordinary user',business:'Business',organization:'Organization',service_provider:'Service provider'})[String(r||'').toLowerCase()]||r||'Unassigned role'}
function renderUsers(){const n=($('#userSearch').value||'').trim().toLowerCase(),f=$('#roleFilter').value;const rows=allUsers.filter(u=>{const p=u.profile||{};return(!n||[p.full_name,u.email,p.phone,u.id,u.role].join(' ').toLowerCase().includes(n))&&(!f||(f==='no-profile'?!u.profile:String(u.role||'user').toLowerCase()===f))});
$('#usersList').innerHTML=rows.map(u=>{const p=u.profile||{},l=u.listing;return `<article class="card user-card"><div class="listing-title-row"><div><h2>${esc(p.full_name||u.email||'Unnamed account')}</h2><p class="muted user-meta">${esc(u.email||'No email available')}</p></div>${p.avatar_url?`<img class="profile-avatar" src="${esc(p.avatar_url)}" alt="Profile picture" loading="lazy">`:''}</div><p class="user-meta"><strong>Role:</strong> ${esc(roleName(u.role))}</p><p class="user-meta"><strong>Joined:</strong> ${esc(u.created_at?new Date(u.created_at).toLocaleDateString():'Unknown')} · <span class="user-status">${u.confirmed_at?'Email confirmed':'Email not confirmed'}</span></p><p class="user-meta"><strong>Phone:</strong> ${esc(p.phone||'Not provided')}</p><p class="user-meta"><strong>Public profile:</strong> ${l?`${esc(l.name||'Unnamed listing')} · ${esc(l.type||'Type not set')} · ${esc(l.status||'Status not set')}`:'No public listing'}</p><p class="user-meta"><strong>Account profile:</strong> ${u.profile?'Available':'Missing — can be created by editing'}</p><div class="actions"><a class="button secondary" href="admin-edit-user.html?id=${encodeURIComponent(u.id)}">Edit account profile</a>${l?`<a class="button" href="admin-edit.html?id=${encodeURIComponent(l.id)}">Edit public profile</a>`:''}</div></article>`}).join('')||'<div class="card">No users match this search/filter.</div>';$('#usersMsg').textContent=`${rows.length} shown · ${allUsers.length} registered account(s) returned by Supabase Auth.`}
async function loadAdminUsers(){$('#reloadUsers').disabled=true;$('#usersMsg').textContent='Loading all registered accounts…';try{if(await window.maltV29.role()!=='admin'){$('#usersMsg').textContent='Administrator access only.';$('#usersList').innerHTML='';return}const {data:{session},error}=await maltSupabase.auth.getSession();if(error)throw error;if(!session){$('#usersMsg').textContent='Your session has expired. Sign in again.';return}const r=await fetch(`${MALT_SUPABASE_URL}/functions/v1/admin-users`,{headers:{Authorization:`Bearer ${session.access_token}`,apikey:MALT_SUPABASE_ANON_KEY}});const data=await r.json().catch(()=>({error:'The server returned an unreadable response.'}));if(!r.ok)throw Error(data.error||`Could not load users (HTTP ${r.status}).`);allUsers=Array.isArray(data.users)?data.users:[];renderUsers()}catch(e){$('#usersMsg').textContent=`Could not load all registered users: ${e.message||e}.`;$('#usersList').innerHTML='<div class="card"><p>The secure Supabase Edge Function must be installed and deployed before this page can list every Auth account. Never put a service-role key in this website.</p></div>'}finally{$('#reloadUsers').disabled=false}}
$('#userSearch').addEventListener('input',renderUsers);$('#roleFilter').addEventListener('change',renderUsers);$('#reloadUsers').addEventListener('click',loadAdminUsers);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',loadAdminUsers);else loadAdminUsers()})();
</script></body></html>
