<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users — MALTWEB Admin</title><link rel="stylesheet" href="assets/css/app.css"></head><body><header class="nav"><a class="brand" href="index.html">MALT<span>WEB</span></a><nav><a href="dashboard.html">Account</a><a href="admin.html">Admin</a><a href="admin-content.html">Content</a></nav></header><main class="page"><p class="eyebrow">ADMIN CONTROL</p><h1>Users & profiles</h1><p id="usersMsg" class="muted">Loading…</p><div id="usersList" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/v27.js"></script><script src="assets/js/v29.js"></script><script>async function loadAdminUsers(){const r=await window.maltV29.role();if(r!=="admin"){document.querySelector('#usersMsg').textContent='Administrator access only.';return}const [p,l]=await Promise.all([maltSupabase.from('account_profiles').select('user_id,full_name,phone,bio,avatar_url,updated_at').order('updated_at',{ascending:false}),maltSupabase.from('listings').select('id,owner_id,name,type,status,location').order('created_at',{ascending:false})]);if(p.error){document.querySelector('#usersMsg').textContent=p.error.message;return}const lm={};(l.data||[]).forEach(x=>{if(!lm[x.owner_id])lm[x.owner_id]=x});document.querySelector('#usersList').innerHTML=(p.data||[]).map(x=>{const q=lm[x.user_id];return `<article class="card"><div class="listing-title-row"> <div><h2>${esc(x.full_name||'Unnamed account')}</h2><p class="muted">${q?esc(q.type)+' · '+esc(q.status):'No public profile yet'}</p></div>${x.avatar_url?`<img class="profile-avatar" src="${esc(x.avatar_url)}" alt="Profile picture">`:''}</div><p>${esc(x.phone||'')}</p><p>${esc(x.bio||'')}</p><div class="actions">${q?`<a class="button" href="admin-edit.html?id=${encodeURIComponent(q.id)}">Edit public profile</a>`:''}<a class="button secondary" href="admin-edit-user.html?id=${encodeURIComponent(x.user_id)}">Edit account profile</a></div></article>`}).join('')||'<div class="card">No account profiles found.</div>';document.querySelector('#usersMsg').textContent=`${(p.data||[]).length} profile records.`}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',loadAdminUsers);else loadAdminUsers();</script></body></html>
