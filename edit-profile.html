<main class="page"><p class="eyebrow">MANAGE YOUR PROFILE</p><h1>Edit profile</h1><div class="card"><span class="pill" id="editRole">Checking account role…</span><p class="muted">Changes go back to <strong>Pending</strong> review so approved information stays trustworthy.</p></div>
<form id="editForm" class="card form">
<input id="epn" placeholder="Profile name" required>
<select id="epc" required><option value="">Choose category</option></select>

<textarea id="epd" placeholder="Description" required></textarea>
<input id="epp" placeholder="Phone">
<input id="epw" placeholder="Website (optional)">
<div class="form-grid"><input id="eprice" placeholder="Price / rate (optional)"><input id="epriceUnit" placeholder="Per hour, day, job... (optional)"></div>
<input id="eparea" placeholder="Service area (e.g. Luwero & nearby) (optional)">
<button>Save changes</button><p id="editMsg" class="muted"></p>
</form></main>
